    <body>

        <!-- Spinner Start -->
        <div id="spinner" class="show w-100 vh-100 bg-white position-fixed translate-middle top-50 start-50  d-flex align-items-center justify-content-center">

  <div class="container">
    <h1>Manual vs Automatic Machines</h1>

    <div class="progress-bar">
      <div class="progress" id="progress"></div>
    </div>

    <div id="nameSection">
      <h2>Enter Your Name to Start</h2>
      <input type="text" id="studentName" placeholder="e.g. Alice" />
      <button class="start-btn" onclick="startQuiz()">Start Quiz</button>
    </div>

    <div id="quiz" class="hidden"></div>
  </div>

  <script>
    const questions = [
      {
        question: "Which of the following is a manual machine?",
        options: ["Washing Machine", "Hand Pump", "Dishwasher", "Elevator"],
        answer: 1
      },
      {
        question: "What type of machine is a microwave?",
        options: ["Manual", "Mechanical", "Automatic", "Hybrid"],
        answer: 2
      },
      {
        question: "Which machine requires human effort to operate?",
        options: ["ATM", "Hand Fan", "Elevator", "Microwave"],
        answer: 1
      },
      {
        question: "A bicycle is an example of a:",
        options: ["Semi-automatic Machine", "Manual Machine", "Automatic Machine", "Electronic Machine"],
        answer: 1
      },
      {
        question: "Which of these machines can work on its own after being programmed?",
        options: ["Mortar and Pestle", "Manual Sewing Machine", "Air Conditioner", "Hammer"],
        answer: 2
      }
    ];

    let currentQuestion = 0;
    let score = 0;
    let locked = false;
    let studentName = "";

    const quizContainer = document.getElementById("quiz");
    const progressBar = document.getElementById("progress");

    function startQuiz() {
      const input = document.getElementById("studentName");
      if (input.value.trim() === "") {
        alert("Please enter your name.");
        return;
      }
      studentName = input.value.trim();
      document.getElementById("nameSection").classList.add("hidden");
      quizContainer.classList.remove("hidden");
      loadQuestion();
    }

    function loadQuestion() {
      locked = false;
      const q = questions[currentQuestion];
      progressBar.style.width = ((currentQuestion) / questions.length) * 100 + "%";

      quizContainer.innerHTML = `
        <div class="question">
          <h2>Question ${currentQuestion + 1} of ${questions.length}</h2>
          <p>${q.question}</p>
          ${q.options.map((opt, i) => `
            <div class="option" onclick="selectAnswer(${i})">${opt}</div>
          `).join('')}
          <div class="feedback" id="feedback"></div>
          <button class="next-btn hidden" id="nextBtn" onclick="nextQuestion()">Next</button>
        </div>
      `;
    }

    function selectAnswer(index) {
      if (locked) return;
      locked = true;

      const options = document.querySelectorAll(".option");
      const feedback = document.getElementById("feedback");
      const nextBtn = document.getElementById("nextBtn");

      if (index === questions[currentQuestion].answer) {
        options[index].classList.add("correct");
        feedback.textContent = "✅ Correct!";
        score++;
      } else {
        options[index].classList.add("wrong");
        options[questions[currentQuestion].answer].classList.add("correct");
        feedback.textContent = "❌ Wrong!";
      }

      nextBtn.classList.remove("hidden");
    }

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      progressBar.style.width = "100%";
      quizContainer.innerHTML = `
        <h2>🎉 Quiz Complete!</h2>
        <p><strong>${studentName}</strong>, you scored <strong>${score}/${questions.length}</strong></p>
        <p>Submitting your result...</p>
      `;
      submitToGoogleSheet(studentName, score);
    }

    function submitToGoogleSheet(name, score) {
      const endpoint = 'https://script.google.com/macros/s/AKfycbwBFwN0Q8vjIZTBO07O3IbYM6iOhzv7E9HsFZnDFOZYOCdIA_Q0FQv4MlXcgIJiqAyT/exec';

      fetch(endpoint, {
        method: 'POST',
        body: JSON.stringify({ name: name, score: score }),
        headers: {
          'Content-Type': 'application/json'
        }
      })
      .then(res => res.text())
      .then(data => {
        quizContainer.innerHTML += `<p>✅ Result saved to Google Sheet!</p>`;
      })
      .catch(err => {
        quizContainer.innerHTML += `<p>⚠️ Error saving result. Try again later.</p>`;
        console.error("Error submitting:", err);
      });
    }
  </script>
